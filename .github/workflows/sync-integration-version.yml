name: Sync Integration Version

on:
  pull_request:
    types: [closed]
    branches: [master]

jobs:
  sync-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout moengage-gtm-initialization
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Extract version from metadata.yaml
        run: |
          NOTES=$(grep 'changeNotes:' metadata.yaml | tail -1 | sed -E "s/^[[:space:]]*changeNotes:[[:space:]]*//")
          VERSION=$(echo "$NOTES" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract a semver version from the latest metadata.yaml changeNotes: $NOTES"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Update integrationVersion in template.tpl
        run: |
          sed -i -E "s/data\.integrationVersion = [^;]+;/data.integrationVersion = '${VERSION}';/" template.tpl
          grep -qF "data.integrationVersion = '${VERSION}';" template.tpl || {
            echo "::error::Failed to set data.integrationVersion to ${VERSION} in template.tpl"
            exit 1
          }

      - name: Validate sandboxed JS still parses (own repo)
        run: |
          sed -n '/^___SANDBOXED_JS_FOR_WEB_TEMPLATE___/,/^___WEB_PERMISSIONS___/p' template.tpl | sed '1d;$d' > /tmp/sandboxed-own.js
          node --check /tmp/sandboxed-own.js

      - name: Commit and push (own repo)
        run: |
          if git diff --quiet -- template.tpl; then
            echo "template.tpl already up to date, skipping commit"
          else
            git add template.tpl
            git commit -m "chore: sync integrationVersion to ${VERSION}"
            git push origin master
          fi

      - name: Record origin commit SHA
        run: echo "ORIGIN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Checkout moengage-gtm-actions
        uses: actions/checkout@v4
        with:
          repository: moengage/moengage-gtm-actions
          ref: master
          token: ${{ secrets.SDK_BOT_ACCESS_TOKEN }}
          path: gtm-actions

      - name: Update Moengage.setIntegrationVersion in moengage-gtm-actions
        working-directory: gtm-actions
        run: |
          if grep -qE "callInWindow\('Moengage\.setIntegrationVersion', [^)]+\);" template.tpl; then
            sed -i -E "s/callInWindow\('Moengage\.setIntegrationVersion', [^)]+\);/callInWindow('Moengage.setIntegrationVersion', '${VERSION}');/" template.tpl
          else
            sed -i -E "s/^([[:space:]]*)data\.gtmOnSuccess\(\);/\1callInWindow('Moengage.setIntegrationVersion', '${VERSION}');\n\1data.gtmOnSuccess();/" template.tpl
          fi
          grep -qF "callInWindow('Moengage.setIntegrationVersion', '${VERSION}');" template.tpl || {
            echo "::error::Failed to set Moengage.setIntegrationVersion to ${VERSION} in moengage-gtm-actions/template.tpl"
            exit 1
          }

      - name: Validate sandboxed JS still parses (moengage-gtm-actions)
        working-directory: gtm-actions
        run: |
          sed -n '/^___SANDBOXED_JS_FOR_WEB_TEMPLATE___/,/^___WEB_PERMISSIONS___/p' template.tpl | sed '1d;$d' > /tmp/sandboxed-actions.js
          node --check /tmp/sandboxed-actions.js

      - name: Record metadata.yaml entry in moengage-gtm-actions
        working-directory: gtm-actions
        run: |
          if git diff --quiet -- template.tpl; then
            echo "template.tpl already up to date in moengage-gtm-actions, nothing to sync"
          else
            {
              echo "  - sha: ${ORIGIN_SHA}"
              echo "    changeNotes: ${VERSION} Added versioning in GTM templates"
            } >> metadata.yaml
          fi

      - name: Commit and push moengage-gtm-actions
        working-directory: gtm-actions
        run: |
          if git diff --quiet; then
            echo "Nothing to sync into moengage-gtm-actions, skipping commit"
          else
            git add template.tpl metadata.yaml
            git commit -m "chore: sync integrationVersion to ${VERSION}"
            git push origin master
          fi
